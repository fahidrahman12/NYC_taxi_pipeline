version: 2

models:
  - name: stg_yellow_taxi
    description: >
      Cleaned and standardised yellow taxi trip records. Each row represents
      one completed trip. Invalid rows (negative fares, impossible timestamps)
      are filtered out.
    columns:
      - name: vendor_id
        description: "TPEP provider identifier."
        tests:
          - not_null
      - name: pickup_datetime
        description: "Timestamp when the meter was engaged."
        tests:
          - not_null
      - name: dropoff_datetime
        description: "Timestamp when the meter was disengaged."
        tests:
          - not_null
      - name: pickup_location_id
        description: "TLC Taxi Zone ID for pickup."
        tests:
          - not_null
          - relationships:
              to: ref('stg_taxi_zones')
              field: location_id
      - name: dropoff_location_id
        description: "TLC Taxi Zone ID for dropoff."
        tests:
          - not_null
          - relationships:
              to: ref('stg_taxi_zones')
              field: location_id
      - name: payment_type_id
        description: "Numeric code for payment method."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
      - name: fare_amount
        description: "Meter fare in USD."
        tests:
          - not_null
      - name: total_amount
        description: "Total charged to passenger in USD."
        tests:
          - not_null
      - name: taxi_type
        description: "Discriminator column — always 'yellow' for this model."
        tests:
          - not_null
          - accepted_values:
              values: ["yellow"]

  - name: stg_green_taxi
    description: >
      Cleaned and standardised green taxi trip records. Uses the same column
      contract as stg_yellow_taxi so both models can be unioned in the marts layer.
      Green-only fields (trip_type) are included; yellow-only fields (airport_fee)
      are null.
    columns:
      - name: vendor_id
        description: "LPEP provider identifier."
        tests:
          - not_null
      - name: pickup_datetime
        description: "Timestamp when the meter was engaged."
        tests:
          - not_null
      - name: dropoff_datetime
        description: "Timestamp when the meter was disengaged."
        tests:
          - not_null
      - name: pickup_location_id
        description: "TLC Taxi Zone ID for pickup."
        tests:
          - not_null
          - relationships:
              to: ref('stg_taxi_zones')
              field: location_id
      - name: dropoff_location_id
        description: "TLC Taxi Zone ID for dropoff."
        tests:
          - not_null
          - relationships:
              to: ref('stg_taxi_zones')
              field: location_id
      - name: payment_type_id
        description: "Numeric code for payment method."
        tests:
          - not_null
      - name: trip_type
        description: "1=Street-hail, 2=Dispatch. Green taxi only."
      - name: taxi_type
        description: "Discriminator column — always 'green' for this model."
        tests:
          - not_null
          - accepted_values:
              values: ["green"]

  - name: stg_taxi_zones
    description: "TLC Taxi Zone reference data — maps LocationID to borough and zone name."
    columns:
      - name: location_id
        description: "Primary key — unique TLC zone identifier."
        tests:
          - not_null
          - unique
      - name: borough
        description: "NYC borough name."
        tests:
          - not_null
      - name: zone_name
        description: "Zone name within the borough."
        tests:
          - not_null
      - name: service_zone
        description: "Service zone category."
